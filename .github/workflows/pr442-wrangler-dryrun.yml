name: PR442 Wrangler Dry Run

on:
  push:
    branches:
      - control/remove-calendar-perf-diagnostics

permissions:
  contents: read

jobs:
  wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run --outdir /tmp/familytodo-wrangler-dryrun
