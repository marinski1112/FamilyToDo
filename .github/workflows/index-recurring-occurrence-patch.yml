name: Index recurring occurrence patch
on:
  push:
    branches: [refactor/index-recurring-occurrence]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact AST extraction
        run: node scripts/tmp_index_recurring_occurrence_patch.mjs
      - name: Focused modularity contract
        run: node scripts/recurring-occurrence-modularity-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Browser JS
        run: npm run check:browser-js
      - name: Static assets
        run: npm run check:static-assets
      - name: Migrations
        run: npm run check:migrations
      - name: Full regression suite
        run: node scripts/regression-suite.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/tmp_index_recurring_occurrence_patch.mjs .github/workflows/index-recurring-occurrence-patch.yml
          git add src/index.ts src/recurring-occurrence.ts scripts/recurring-occurrence-modularity-contract.mjs scripts/regression-manifest.mjs
          git diff --cached --check
          git commit -m "Refactor recurring occurrence conversion out of index"
          git push
