name: Notification delivery extraction
on:
  push:
    branches: [refactor/notification-delivery]

permissions:
  contents: write

concurrency:
  group: notification-delivery-extraction
  cancel-in-progress: true

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: refactor/notification-delivery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact extraction
        run: node scripts/tmp_notification_delivery_patch.mjs
      - name: Focused modularity contract
        run: node scripts/notification-delivery-modularity-contract.mjs
      - run: npm run typecheck
        if: always()
      - run: npm run check:browser-js
        if: always()
      - run: npm run check:static-assets
        if: always()
      - run: npm run check:migrations
        if: always()
      - run: node scripts/regression-suite.mjs
        if: always()
      - name: Diff check
        run: git diff --check
        if: always()
      - name: Commit verified extraction
        if: success()
        run: |
          rm scripts/tmp_notification_delivery_patch.mjs
          rm .github/workflows/notification-delivery-patch.yml
          git add src/index.ts src/notification-delivery.ts scripts/notification-delivery-modularity-contract.mjs scripts/regression-manifest.mjs scripts/worker-error-log-privacy-contract.mjs scripts/notification-lifecycle-modularity-contract.mjs scripts/platform-integration-contract.mjs scripts/tmp_notification_delivery_patch.mjs .github/workflows/notification-delivery-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refactor notification delivery out of index"
          git push
