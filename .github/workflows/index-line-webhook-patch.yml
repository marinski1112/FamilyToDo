name: Index LINE webhook patch

on:
  push:
    branches:
      - refactor/index-line-webhook

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/index-line-webhook
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact extraction
        run: node scripts/tmp_index_line_webhook_patch.mjs
      - name: Verify focused contracts
        run: |
          node scripts/line-webhook-modularity-contract.mjs
          node scripts/worker-error-log-privacy-contract.mjs
      - name: Run full regression suite
        run: npm test
      - name: Check diff
        run: git diff --check
      - name: Remove temporary patch runner
        run: rm scripts/tmp_index_line_webhook_patch.mjs .github/workflows/index-line-webhook-patch.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor LINE webhook out of index"
          git push origin HEAD:refactor/index-line-webhook
