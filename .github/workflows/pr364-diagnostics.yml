name: PR364 diagnostics
on:
  push:
    branches: [refactor/page-route-dispatcher]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck
        run: npm run typecheck > pr364-typecheck.log 2>&1 || true
      - name: Capture regressions
        run: node scripts/regression-suite.mjs > pr364-regression.log 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr364-diagnostics.yml
          git add pr364-typecheck.log pr364-regression.log
          git commit -m "Capture PR364 diagnostics"
          git push
