name: audit-google-inquiry-runtime-334
on:
  push:
    branches: [audit/google-inquiry-runtime-334]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/google-inquiry-runtime-334
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch exact current sources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app=Path('src/app.ts')
          s=app.read_text()
          old="import { DEFAULT_FAMILY_TIMEZONE, FAMILY_TIMEZONE_OPTIONS, addWallClockMinutes, familyNow, validateTimezone } from './timezone';"
          new="import { DEFAULT_FAMILY_TIMEZONE, FAMILY_TIMEZONE_OPTIONS, addWallClockMinutes, familyDate, familyNow, validateTimezone } from './timezone';"
          assert s.count(old)==1
          s=s.replace(old,new)
          needle="  return {date,tasks:[...tasks.results,...recurring].sort((a,b)=>String(a.start_at||a.due_at).localeCompare(String(b.start_at||b.due_at))),items:items.results,shopping:shopping.results,expiredTasks};\n}\n\nexport async function today"
          helper="""  return {date,tasks:[...tasks.results,...recurring].sort((a,b)=>String(a.start_at||a.due_at).localeCompare(String(b.start_at||b.due_at))),items:items.results,shopping:shopping.results,expiredTasks};
}

export type GoogleVoiceInquiryLineKind='TODAY_SCHEDULE'|'TOMORROW_SCHEDULE'|'OPEN_SHOPPING';
/** Reuses the same recurrence-aware daily projection and child visibility predicate as app views. */
export async function resolveGoogleVoiceInquiryLines(env:Env,familyId:number,memberId:number,kind:GoogleVoiceInquiryLineKind):Promise<readonly string[]>{
  if(!Number.isSafeInteger(familyId)||familyId<=0||!Number.isSafeInteger(memberId)||memberId<=0)throw new Error('invalid-google-inquiry-scope');
  const member=await memberById(env,memberId);
  if(!member||member.family_id!==familyId)throw new Error('google-inquiry-member-tenant-mismatch');
  if(kind==='OPEN_SHOPPING'){
    const rows=await env.DB.prepare(`SELECT s.name,s.quantity FROM shopping_items s WHERE s.family_id=? AND s.status='pending' AND ${taskChildVisibilitySql('s')} ORDER BY CASE WHEN s.due_date IS NULL OR s.due_date='' THEN 1 ELSE 0 END,s.due_date,s.id LIMIT 32`).bind(familyId,memberId).all<Row>();
    return rows.results.map(row=>{const name=String(row.name||'').trim();const quantity=Number(row.quantity||1);return name?(Number.isFinite(quantity)&&quantity>1?`${name} ×${quantity}`:name):'';}).filter(Boolean);
  }
  const zone=String(member.family_timezone||env.APP_TIMEZONE||DEFAULT_FAMILY_TIMEZONE),base=familyDate(zone);
  let date=base;
  if(kind==='TOMORROW_SCHEDULE'){const d=new Date(`${base}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+1);date=d.toISOString().slice(0,10);}
  const data=await makeViewData({env,member} as AppContext,date);
  return data.tasks.filter(row=>String(row.status||'pending')!=='completed').slice(0,32).map(row=>String(row.title||'').trim()).filter(Boolean);
}

export async function today"""
          assert s.count(needle)==1
          s=s.replace(needle,helper)
          app.write_text(s)

          gt=Path('src/google-tasks.ts')
          s=gt.read_text()
          old="import { createExternalShoppingItemDomain, recordConfiguredQuickActionDomain, recordGoogleVoiceFamilyLogDomain, layout, type AppContext } from './app';"
          new="import { createExternalShoppingItemDomain, recordConfiguredQuickActionDomain, recordGoogleVoiceFamilyLogDomain, resolveGoogleVoiceInquiryLines, layout, type AppContext } from './app';\nimport { executeGoogleTasksInquiryCommand } from './google-tasks-inquiry-command';"
          assert s.count(old)==1
          s=s.replace(old,new)
          needle="export async function applyGoogleTask(env:Env,a:Row,item:any,voiceContexts=new Map<number,Promise<VoiceContext>>()){if(!item?.id)return 'noop';if(hasGoogleVoiceMarker(item.title)){"
          replacement="export async function applyGoogleTask(env:Env,a:Row,item:any,voiceContexts=new Map<number,Promise<VoiceContext>>()){if(!item?.id)return 'noop';const inquiry=await executeGoogleTasksInquiryCommand(env,{id:Number(a.id),familyId:Number(a.family_id),memberId:Number(a.member_id),tasklistId:String(a.tasklist_id||'')},item,kind=>resolveGoogleVoiceInquiryLines(env,Number(a.family_id),Number(a.member_id),kind));if(inquiry!=='not-inquiry')return inquiry==='executed'?'command':inquiry==='error'?'review':'noop';if(hasGoogleVoiceMarker(item.title)){"
          assert s.count(needle)==1
          s=s.replace(needle,replacement)
          gt.write_text(s)

          contract=Path('scripts/google-tasks-inquiry-runtime-wiring-contract.mjs')
          contract.write_text("""import fs from 'node:fs';
const tasks=fs.readFileSync('src/google-tasks.ts','utf8');
const app=fs.readFileSync('src/app.ts','utf8');
const fail=m=>{console.error(`google tasks inquiry runtime wiring contract: ${m}`);process.exit(1)};
const must=(c,m)=>{if(!c)fail(m)};
must(tasks.includes("import { executeGoogleTasksInquiryCommand } from './google-tasks-inquiry-command';"),'runtime must import retained inquiry ledger adapter');
const call=tasks.indexOf('executeGoogleTasksInquiryCommand(env,');
const legacy=tasks.indexOf('if(hasGoogleVoiceMarker(item.title))');
must(call>=0&&legacy>call,'typed inquiry adapter must run before legacy marked-command parsing');
must(tasks.includes('kind=>resolveGoogleVoiceInquiryLines(env,Number(a.family_id),Number(a.member_id),kind)'),'runtime must inject canonical app resolver');
must(tasks.includes("if(inquiry!=='not-inquiry')"),'non-inquiry commands must fall through');
must(app.includes('export async function resolveGoogleVoiceInquiryLines'),'canonical inquiry resolver must be retained in app domain');
const helper=app.slice(app.indexOf('export async function resolveGoogleVoiceInquiryLines'),app.indexOf('\nexport async function today',app.indexOf('export async function resolveGoogleVoiceInquiryLines')));
must(helper.includes('makeViewData({env,member} as AppContext,date)'),'schedule inquiry must reuse recurrence-aware daily projection');
must(helper.includes("taskChildVisibilitySql('s')")&&helper.includes("s.status='pending'"),'shopping inquiry must reuse child privacy predicate and only open rows');
must(helper.includes('LIMIT 32')&&helper.includes('.slice(0,32)'),'inquiry line sources must stay bounded');
must(helper.includes('member.family_id!==familyId'),'resolver must fail closed across tenant mismatch');
must(!helper.includes('console.'),'resolver must not log private result contents');
console.log('google tasks inquiry runtime wiring contract: canonical bounded tenant-scoped runtime connection ok');
""")

          bundle=Path('scripts/feature-contract-bundle.mjs')
          s=bundle.read_text()
          needle="    ['google-tasks-inquiry-command',['node','scripts/google-tasks-inquiry-command-contract.mjs']],\n"
          replacement=needle+"    ['google-tasks-inquiry-runtime-wiring',['node','scripts/google-tasks-inquiry-runtime-wiring-contract.mjs']],\n"
          assert s.count(needle)==1
          bundle.write_text(s.replace(needle,replacement))
          PY
          npm test
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/audit-google-inquiry-runtime-334.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.ts src/google-tasks.ts scripts/feature-contract-bundle.mjs scripts/google-tasks-inquiry-runtime-wiring-contract.mjs .github/workflows/audit-google-inquiry-runtime-334.yml
          git commit -m 'Wire Google Tasks inquiries into inbound runtime'
          git push origin HEAD:audit/google-inquiry-runtime-334
