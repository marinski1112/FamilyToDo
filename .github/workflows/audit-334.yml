name: audit-334
on:
  push:
    branches:
      - audit/google-inquiry-runtime-334
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/google-inquiry-runtime-334
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/audit-google-inquiry-runtime-334.py
      - run: npm test
      - name: Commit exact patch
        run: |
          rm .github/workflows/audit-334.yml scripts/audit-google-inquiry-runtime-334.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Wire Google Tasks inquiries into inbound runtime"
          git push origin HEAD:audit/google-inquiry-runtime-334
