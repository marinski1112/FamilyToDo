name: Child Journal schema guard patch

on:
  push:
    branches:
      - fix/child-journal-schema-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/child-journal-schema-guard
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact schema guards and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/child-journal.ts)" = "dff85a5e43ec6cf3bcc3ab8742abbc72c27466b1"
          test "$(git hash-object src/child-journal-calendar.ts)" = "a60f2b8488b693ba8bbb8349919f58451e500781"
          test "$(git hash-object src/child-journal-schema.ts)" = "8948aee1cd5d5a1a54cd58526dd836ca47f10ad4"
          test "$(git hash-object scripts/child-growth-journal-contract.mjs)" = "a644017f4c8becebd0de331c99048ae5ad212dd8"
          test "$(git hash-object scripts/child-journal-google-calendar-contract.mjs)" = "49098a643d4cbcddedec799d9dd01cf3194fecb4"
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p=Path(path); source=p.read_text()
              count=source.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one exact anchor, found {count}')
              p.write_text(source.replace(old,new,1))

          replace_one(
              'src/child-journal.ts',
              "import { childJournalCalendarStatus, processChildJournalCalendarOutbox } from './child-journal-calendar';\n",
              "import { childJournalCalendarStatus, processChildJournalCalendarOutbox } from './child-journal-calendar';\nimport { childJournalFoundationReady, childJournalSchemaStatus } from './child-journal-schema';\n",
              'journal schema import',
          )
          replace_one(
              'src/child-journal.ts',
              "  const member=requireMember(ctx);if(request.method!=='POST')return new Response('Method Not Allowed',{status:405});\n",
              "  const member=requireMember(ctx);if(request.method!=='POST')return new Response('Method Not Allowed',{status:405});if(!(await childJournalFoundationReady(ctx.env.DB)))return new Response('成長日記のデータベース更新が必要です。',{status:503});\n",
              'journal api foundation guard',
          )
          old_page="  const member=requireMember(ctx);if(!ctx.session.csrfToken)ctx.session.csrfToken=crypto.randomUUID();const url=new URL(request.url);const timezone=String(member.family_timezone||ctx.env.APP_TIMEZONE||DEFAULT_FAMILY_TIMEZONE);const today=familyDate(timezone);const requestedMonth=String(url.searchParams.get('month')||'');const month=validMonth(requestedMonth)?requestedMonth:today.slice(0,7);const requestedSubject=Number(url.searchParams.get('subject_id')||0);\n"
          new_page=old_page+"  const schema=await childJournalSchemaStatus(ctx.env.DB);if(!schema.foundation){const body='<div class=\"card\"><h1>📔 成長日記</h1><p>データベース更新の反映待ちです。管理側でmigration適用後に自動で利用可能になります。</p><a class=\"btn gray\" href=\"/app/family_log.php\">家族ログへ戻る</a></div>';return html(layout('成長日記',body,'/app/family_log.php'));}\n"
          replace_one('src/child-journal.ts',old_page,new_page,'journal page foundation guard')
          replace_one(
              'src/child-journal.ts',
              "  const syncText=!calendarSync.oauthLinked?'Google Calendar未連携':calendarSync.errors?`同期エラー ${calendarSync.errors}件`:calendarSync.pending?`同期待ち ${calendarSync.pending}件`:calendarSync.calendarCreated?`${calendarSync.calendarName} に自動同期中`:'連携済み・最初の記録時に専用カレンダーを作成';\n",
              "  const syncText=!calendarSync.schemaReady?'Google Calendar同期のDB更新待ち':!calendarSync.oauthLinked?'Google Calendar未連携':calendarSync.errors?`同期エラー ${calendarSync.errors}件`:calendarSync.pending?`同期待ち ${calendarSync.pending}件`:calendarSync.calendarCreated?`${calendarSync.calendarName} に自動同期中`:'連携済み・最初の記録時に専用カレンダーを作成';\n",
              'journal calendar schema UI',
          )

          replace_one(
              'src/child-journal-calendar.ts',
              "import { DEFAULT_FAMILY_TIMEZONE, utcNow } from './timezone';\n",
              "import { DEFAULT_FAMILY_TIMEZONE, utcNow } from './timezone';\nimport { childJournalCalendarReady } from './child-journal-schema';\n",
              'calendar schema import',
          )
          replace_one(
              'src/child-journal-calendar.ts',
              "  const result={sent:0,errors:0};\n  if(!env.GOOGLE_CALENDAR_CLIENT_ID||!env.GOOGLE_CALENDAR_CLIENT_SECRET||!env.GOOGLE_CALENDAR_TOKEN_KEY)return result;\n",
              "  const result={sent:0,errors:0};\n  if(!(await childJournalCalendarReady(env.DB)))return result;\n  if(!env.GOOGLE_CALENDAR_CLIENT_ID||!env.GOOGLE_CALENDAR_CLIENT_SECRET||!env.GOOGLE_CALENDAR_TOKEN_KEY)return result;\n",
              'calendar outbox schema guard',
          )
          replace_one(
              'src/child-journal-calendar.ts',
              "export async function childJournalCalendarStatus(db:D1Database,familyId:number){\n  const [oauth,binding,pending]=await Promise.all([\n",
              "export async function childJournalCalendarStatus(db:D1Database,familyId:number){\n  if(!(await childJournalCalendarReady(db)))return {schemaReady:false,oauthLinked:false,calendarCreated:false,calendarName:JOURNAL_CALENDAR_NAME,status:'',pending:0,errors:0,lastSyncedAt:''};\n  const [oauth,binding,pending]=await Promise.all([\n",
              'calendar status schema guard',
          )
          replace_one(
              'src/child-journal-calendar.ts',
              "  return {\n    oauthLinked:String(oauth?.status||'')==='ACTIVE',\n",
              "  return {\n    schemaReady:true,\n    oauthLinked:String(oauth?.status||'')==='ACTIVE',\n",
              'calendar status ready flag',
          )

          growth=Path('scripts/child-growth-journal-contract.mjs'); source=growth.read_text()
          source=source.replace("const journal=fs.readFileSync(new URL('../src/child-journal.ts',import.meta.url),'utf8');\n", "const journal=fs.readFileSync(new URL('../src/child-journal.ts',import.meta.url),'utf8');\nconst schema=fs.readFileSync(new URL('../src/child-journal-schema.ts',import.meta.url),'utf8');\n",1)
          anchor="if(!journal.includes(\"FROM family_log_journal_entries j JOIN family_logs l ON l.id=j.log_id\"))throw new Error('Child Journal calendar must read only explicitly journal-promoted Family Log rows');\n"
          addition="if(!schema.includes(\"const FOUNDATION_TABLES = ['family_log_journal_entries'] as const\"))throw new Error('Child Journal schema guard must use an allow-listed foundation table');\nif(!journal.includes('childJournalFoundationReady(ctx.env.DB)'))throw new Error('Child Journal writes must fail closed until migration 0048 is present');\nif(!journal.includes('データベース更新の反映待ちです。'))throw new Error('Child Journal page must remain usable while migration 0048 is pending');\n"
          if source.count(anchor)!=1: raise SystemExit('growth contract anchor mismatch')
          growth.write_text(source.replace(anchor,addition+anchor,1))

          calendar=Path('scripts/child-journal-google-calendar-contract.mjs'); source=calendar.read_text()
          source=source.replace("const sync=fs.readFileSync(new URL('../src/child-journal-calendar.ts',import.meta.url),'utf8');\n", "const sync=fs.readFileSync(new URL('../src/child-journal-calendar.ts',import.meta.url),'utf8');\nconst schema=fs.readFileSync(new URL('../src/child-journal-schema.ts',import.meta.url),'utf8');\n",1)
          anchor="if(sync.includes(\"child_journal_calendar_accounts WHERE family_id=? AND status='ACTIVE'\"))throw new Error('Retry must reuse the existing dedicated calendar even while its status is ERROR');\n"
          addition="if(!schema.includes(\"'child_journal_calendar_outbox'\"))throw new Error('Child Journal calendar schema guard must allow-list the dedicated outbox');\nif(!sync.includes('if(!(await childJournalCalendarReady(env.DB)))return result;'))throw new Error('Child Journal calendar cron must fail closed until migration 0049 is present');\nif(!sync.includes('schemaReady:false'))throw new Error('Child Journal calendar status must report pending schema without querying missing tables');\nif(!journal.includes(\"!calendarSync.schemaReady?'Google Calendar同期のDB更新待ち'\"))throw new Error('Child Journal UI must expose migration-pending calendar state');\n"
          if source.count(anchor)!=1: raise SystemExit('calendar contract anchor mismatch')
          calendar.write_text(source.replace(anchor,addition+anchor,1))
          PY
          node scripts/child-growth-journal-contract.mjs
          node scripts/child-journal-google-calendar-contract.mjs
          npm test
          git diff --check
          rm .github/workflows/child-journal-schema-guard-patch.yml
      - name: Commit schema guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/child-journal.ts src/child-journal-calendar.ts src/child-journal-schema.ts scripts/child-growth-journal-contract.mjs scripts/child-journal-google-calendar-contract.mjs .github/workflows/child-journal-schema-guard-patch.yml
          git diff --cached --check
          git commit -m "Guard Child Journal schema rollout"
          git push origin HEAD:fix/child-journal-schema-guard
