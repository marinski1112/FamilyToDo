name: Audit PRIVATE event repair

on:
  push:
    branches:
      - audit/private-event-edit-preserve-visibility

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact PRIVATE event server fix and regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/app.ts')
          app = app_path.read_text()
          old = "const makePrivate=!isEvent&&privateTaskRequested(b);"
          new = "const makePrivate=privateTaskRequested(b);"
          count = app.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one PRIVATE event regression site, found {count}')
          app_path.write_text(app.replace(old, new, 1))

          contract_path = Path('scripts/ui-product-contract.mjs')
          contract = contract_path.read_text()
          marker = "assert.match(taskEdit,/is_private:editIsPrivate\\?\\.checked\\|\\|false/,'edit submit payload must carry PRIVATE visibility explicitly');\n"
          addition = """assert.match(app,/const makePrivate=privateTaskRequested\\(b\\);/,'server edit flow must honor PRIVATE for both TASK and EVENT');
          assert.doesNotMatch(app,/const makePrivate=!isEvent&&privateTaskRequested\\(b\\);/,'server edit flow must not force EVENT visibility back to FAMILY');
          assert.ok(app.includes("makePrivate?'PRIVATE':'FAMILY',makePrivate?m.id:null"),'server edit flow must persist PRIVATE scope and owner');
          assert.ok(app.includes('const assignees=makePrivate?[m.id]'),'PRIVATE task/event reminders and child assignments must remain owner-scoped');
          """
          if addition.strip() not in contract:
              if marker not in contract:
                  raise SystemExit('PRIVATE edit contract insertion marker not found')
              contract = contract.replace(marker, marker + addition, 1)
              contract_path.write_text(contract)
          PY
          git diff --check
          git diff -- src/app.ts scripts/ui-product-contract.mjs
      - name: Commit repaired branch and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/audit-private-event-repair.yml
          git add src/app.ts scripts/ui-product-contract.mjs
          git commit -m "Fix PRIVATE event edit persistence"
          git push origin HEAD:audit/private-event-edit-preserve-visibility
