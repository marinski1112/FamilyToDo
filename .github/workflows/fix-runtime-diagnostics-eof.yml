name: Fix runtime diagnostics EOF

on:
  push:
    branches:
      - refactor/index-runtime-diagnostics

permissions:
  contents: write

jobs:
  fix-eof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/index-runtime-diagnostics
      - name: Normalize EOF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/runtime-diagnostics.ts')
          text=p.read_text()
          p.write_text(text.rstrip()+'\n')
          PY
      - run: git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/fix-runtime-diagnostics-eof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize runtime diagnostics EOF"
          git push origin HEAD:refactor/index-runtime-diagnostics
