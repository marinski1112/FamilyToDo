name: Final index entrypoint cleanup
on:
  push:
    branches: [refactor/index-entrypoint-final-cleanup]

permissions:
  contents: write

concurrency:
  group: index-entrypoint-final-cleanup
  cancel-in-progress: true

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: refactor/index-entrypoint-final-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact cleanup
        run: node scripts/tmp_index_entrypoint_final_cleanup_patch.mjs
      - name: Focused final entrypoint contract
        run: node scripts/index-entrypoint-final-contract.mjs
      - run: npm run typecheck
        if: always()
      - run: npm run check:browser-js
        if: always()
      - run: npm run check:static-assets
        if: always()
      - run: npm run check:migrations
        if: always()
      - run: node scripts/regression-suite.mjs
        if: always()
      - name: Diff check
        run: git diff --check
        if: always()
      - name: Commit verified cleanup
        if: success()
        run: |
          rm scripts/tmp_index_entrypoint_final_cleanup_patch.mjs
          rm .github/workflows/index-entrypoint-final-cleanup.yml
          git add src/index.ts src/exception-routes.ts scripts/index-entrypoint-final-contract.mjs scripts/index-entrypoint-modularity-contract.mjs scripts/regression-manifest.mjs scripts/tmp_index_entrypoint_final_cleanup_patch.mjs .github/workflows/index-entrypoint-final-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Finish index entrypoint cleanup"
          git push
