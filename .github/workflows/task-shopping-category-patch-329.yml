name: Task shopping per-item category patch
on:
  push:
    branches:
      - audit/task-shopping-per-item-category-329
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/task-shopping-per-item-category-329
      - name: Apply retained-source patch
        run: python3 .github/patch-329e.py
      - name: Run focused checks
        run: |
          node --check public/assets/task-edit.js
          node scripts/task-event-shopping-integration-contract.mjs
      - name: Commit patch and remove temporary runner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.ts public/assets/task-edit.js scripts/task-event-shopping-integration-contract.mjs
          git rm .github/patch-329.py .github/patch-329b.py .github/patch-329c.py .github/patch-329d.py .github/patch-329e.py .github/workflows/task-shopping-category-patch-329.yml
          git commit -m "Preserve per-item Task shopping categories"
          git push origin HEAD:audit/task-shopping-per-item-category-329
