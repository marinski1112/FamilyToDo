name: Android CI
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: familytodo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Check isolated preview build
        run: gradle -p android :app:assembleDebug -PfamilytodoDebugOrigin=https://preview-familytodo.marinski1112.workers.dev --no-daemon
      - name: Check unsigned internal release build
        run: |
          gradle -p android :app:assembleRelease -PfamilytodoVersionCode=1001 --no-daemon
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
