name: Android internal APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check fixed signing configuration
        env:
          FAMILYTODO_KEYSTORE_B64: ${{ secrets.FAMILYTODO_KEYSTORE_B64 }}
          FAMILYTODO_STORE_PASSWORD: ${{ secrets.FAMILYTODO_STORE_PASSWORD }}
          FAMILYTODO_KEY_ALIAS: ${{ secrets.FAMILYTODO_KEY_ALIAS }}
          FAMILYTODO_KEY_PASSWORD: ${{ secrets.FAMILYTODO_KEY_PASSWORD }}
          FAMILYTODO_SIGNING_CERT_SHA256: ${{ secrets.FAMILYTODO_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          names = ('FAMILYTODO_KEYSTORE_B64', 'FAMILYTODO_STORE_PASSWORD', 'FAMILYTODO_KEY_ALIAS', 'FAMILYTODO_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Fixed signing secrets are not configured')
          if not re.fullmatch(r'[0-9a-fA-F]{64}', os.environ.get('FAMILYTODO_SIGNING_CERT_SHA256', '').replace(':', '')):
              raise SystemExit('Fixed signing certificate SHA-256 is not configured')
          PYCODE
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build unsigned production APK
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))
          gradle -p android :app:assembleRelease -PfamilytodoVersionCode="$VERSION_CODE" --no-daemon
      - name: Sign and verify internal APK
        env:
          FAMILYTODO_KEYSTORE_B64: ${{ secrets.FAMILYTODO_KEYSTORE_B64 }}
          FAMILYTODO_STORE_PASSWORD: ${{ secrets.FAMILYTODO_STORE_PASSWORD }}
          FAMILYTODO_KEY_ALIAS: ${{ secrets.FAMILYTODO_KEY_ALIAS }}
          FAMILYTODO_KEY_PASSWORD: ${{ secrets.FAMILYTODO_KEY_PASSWORD }}
          FAMILYTODO_SIGNING_CERT_SHA256: ${{ secrets.FAMILYTODO_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$FAMILYTODO_KEYSTORE_B64" || -z "$FAMILYTODO_STORE_PASSWORD" ||
                -z "$FAMILYTODO_KEY_ALIAS" || -z "$FAMILYTODO_KEY_PASSWORD" ]]; then
            echo "Internal signing secrets are not configured" >&2
            exit 1
          fi
          umask 077
          trap 'python3 -c "import os,pathlib; (pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"familytodo-internal.jks\").unlink(missing_ok=True)"' EXIT
          printf '%s' "$FAMILYTODO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/familytodo-internal.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/familytodo-internal.jks" \
            --ks-key-alias "$FAMILYTODO_KEY_ALIAS" \
            --ks-pass env:FAMILYTODO_STORE_PASSWORD \
            --key-pass env:FAMILYTODO_KEY_PASSWORD \
            --out "$RUNNER_TEMP/familytodo-internal.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/familytodo-internal.apk" \
            | python3 android/tools/verify_signing_certificate.py
      - uses: actions/upload-artifact@v4
        with:
          name: familytodo-android-internal
          path: ${{ runner.temp }}/familytodo-internal.apk
          if-no-files-found: error
          retention-days: 7
