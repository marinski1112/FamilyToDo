name: tmp-calendar-mobile-ui-error-privacy
on:
  push:
    branches:
      - audit/calendar-mobile-ui-error-privacy-345
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/calendar-mobile-ui-error-privacy-345
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch exact retained Calendar compact UI source and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/calendar-mobile-ui.js')
          s=p.read_text()
          old="""}catch(error){\n  document.documentElement.dataset.calendarMobileUi='error';\n  console.error('[calendar-mobile-ui] initialization failed',error);\n}\n})();"""
          new="""}catch{\n  document.documentElement.dataset.calendarMobileUi='error';\n  console.error('[calendar-mobile-ui] initialization failed');\n}\n})();"""
          if old not in s:
              raise SystemExit('expected Calendar compact UI catch block not found')
          p.write_text(s.replace(old,new,1))

          pkg=Path('package.json')
          ps=pkg.read_text()
          needle='node --check public/assets/calendar.js && node --check public/assets/recurring.js'
          repl='node --check public/assets/calendar.js && node --check public/assets/calendar-mobile-ui.js && node --check public/assets/recurring.js'
          if needle not in ps:
              raise SystemExit('browser-js check anchor not found')
          pkg.write_text(ps.replace(needle,repl,1))

          contract=Path('scripts/calendar-mobile-ui-error-privacy-contract.mjs')
          contract.write_text("""import fs from 'node:fs';\n\nconst source=fs.readFileSync('public/assets/calendar-mobile-ui.js','utf8');\nconst fail=message=>{console.error(message);process.exitCode=1};\n\nif(!source.includes(\"document.documentElement.dataset.calendarMobileUi='error'\"))fail('Calendar mobile UI must retain a bounded failure state');\nif(!source.includes(\"console.error('[calendar-mobile-ui] initialization failed');\"))fail('Calendar mobile UI must log only the fixed initialization marker');\nif(/catch\\s*\\(\\s*(?:error|err|e)\\s*\\)[\\s\\S]{0,240}console\\.(?:error|warn|log)\\([^\\n;]*(?:error|err|e)\\b/.test(source))fail('Calendar mobile UI must not forward arbitrary caught exceptions to console');\nfor(const forbidden of ['payload','cookie','token','title','description','family_id','member_id']){\n  const pattern=new RegExp(`console\\\\.(?:error|warn|log)\\\\([^\\\\n;]*\\\\b${forbidden}\\\\b`,'i');\n  if(pattern.test(source))fail(`Calendar mobile UI console logging must not include ${forbidden}`);\n}\nif(!process.exitCode)console.log('calendar-mobile-ui-error-privacy contract ok');\n""")

          manifest=Path('scripts/regression-manifest.mjs')
          ms=manifest.read_text()
          anchor="      ['calendar-stamp-read-api','node scripts/calendar-animated-stamps-read-api-contract.mjs'],\n"
          line="      ['calendar-mobile-ui-error-privacy','node scripts/calendar-mobile-ui-error-privacy-contract.mjs'],\n"
          if line not in ms:
              if anchor not in ms:
                  raise SystemExit('calendar regression manifest anchor not found')
              ms=ms.replace(anchor,anchor+line,1)
              manifest.write_text(ms)
          PY
          rm .github/workflows/tmp-calendar-mobile-ui-error-privacy.yml
          node --check public/assets/calendar-mobile-ui.js
          node scripts/calendar-mobile-ui-error-privacy-contract.mjs
          npm test
          git diff --check
      - name: Commit branch changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/calendar-mobile-ui.js package.json scripts/calendar-mobile-ui-error-privacy-contract.mjs scripts/regression-manifest.mjs .github/workflows/tmp-calendar-mobile-ui-error-privacy.yml
          git commit -m 'Harden Calendar compact UI error logging privacy'
          git push origin HEAD:audit/calendar-mobile-ui-error-privacy-345
