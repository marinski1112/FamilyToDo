name: Task delete modularity patch
on:
  push:
    branches: [refactor/task-delete-handler]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact task delete extraction
        run: node scripts/tmp_task_delete_modularity_patch.mjs
      - name: Focused task delete contract
        run: node scripts/task-delete-modularity-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Browser JS
        run: npm run check:browser-js
      - name: Static assets
        run: npm run check:static-assets
      - name: Migrations
        run: npm run check:migrations
      - name: Full regression suite
        run: node scripts/regression-suite.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified task delete extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/tmp_task_delete_modularity_patch.mjs .github/workflows/task-delete-modularity-patch.yml
          git add src/index.ts src/task-delete.ts scripts/task-delete-modularity-contract.mjs scripts/regression-manifest.mjs scripts/calendar-projection-queue-contract.mjs
          git diff --cached --check
          git commit -m "Refactor task delete out of index"
          git push
