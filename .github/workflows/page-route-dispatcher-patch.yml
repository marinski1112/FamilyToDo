name: Page route dispatcher patch
on:
  push:
    branches: [refactor/page-route-dispatcher]
    paths-ignore:
      - scripts/tmp_page_route_typecheck.txt

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact page route extraction
        run: node scripts/tmp_page_route_dispatcher_patch.mjs
      - name: Align dispatcher boundary types with existing route handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('src/page-routes.ts')
          text=page.read_text()
          text=text.replace("import type { AppContext } from './app';\n","")
          text=text.replace('context:AppContext,env:Env','context:any,env:any')
          page.write_text(text)
          contract=Path('scripts/page-route-dispatcher-contract.mjs')
          text=contract.read_text().replace('context:AppContext,env:Env','context:any,env:any')
          contract.write_text(text)
          PY
      - name: Focused page route contract
        run: node scripts/page-route-dispatcher-contract.mjs
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee /tmp/page-route-typecheck.log
      - name: Preserve typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        run: |
          cp /tmp/page-route-typecheck.log scripts/tmp_page_route_typecheck.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/tmp_page_route_typecheck.txt
          git commit -m "Record page route typecheck diagnostics"
          git push
          exit 1
      - name: Browser JS
        run: npm run check:browser-js
      - name: Static assets
        run: npm run check:static-assets
      - name: Migrations
        run: npm run check:migrations
      - name: Full regression suite
        run: node scripts/regression-suite.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified dispatcher extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/tmp_page_route_dispatcher_patch.mjs .github/workflows/page-route-dispatcher-patch.yml
          if [ -f scripts/tmp_page_route_typecheck.txt ]; then git rm scripts/tmp_page_route_typecheck.txt; fi
          git add src/index.ts src/page-routes.ts scripts/page-route-dispatcher-contract.mjs scripts/regression-manifest.mjs
          git diff --cached --check
          git commit -m "Refactor page routes into dispatcher"
          git push
