name: Task item new pages extraction
on:
  push:
    branches: [refactor/task-item-new-pages]

permissions:
  contents: write

concurrency:
  group: task-item-new-pages-extraction
  cancel-in-progress: true

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: refactor/task-item-new-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact extraction
        run: node scripts/tmp_task_item_new_pages_patch.mjs
      - name: Focused modularity contract
        run: node scripts/new-entry-pages-modularity-contract.mjs
      - run: npm run typecheck
        if: always()
      - run: npm run check:browser-js
        if: always()
      - run: npm run check:static-assets
        if: always()
      - run: npm run check:migrations
        if: always()
      - run: node scripts/regression-suite.mjs
        if: always()
      - name: Diff check
        run: git diff --check
        if: always()
      - name: Commit verified extraction
        if: success()
        run: |
          rm scripts/tmp_task_item_new_pages_patch.mjs
          rm .github/workflows/task-item-new-pages-patch.yml
          git add src/index.ts src/new-entry-pages.ts scripts/new-entry-pages-modularity-contract.mjs scripts/form-control-contract.mjs scripts/regression-manifest.mjs scripts/tmp_task_item_new_pages_patch.mjs .github/workflows/task-item-new-pages-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refactor task and item new pages out of index"
          git push
