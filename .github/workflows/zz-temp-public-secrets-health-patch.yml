name: Temporary public secrets health patch
on:
  push:
    branches:
      - audit/public-secrets-health-minimization-328
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/public-secrets-health-minimization-328
          fetch-depth: 0
      - name: Apply exact source patch
        run: node scripts/zz-temp-public-secrets-health-patch.mjs
      - name: Run focused privacy contract
        run: node scripts/public-secrets-health-privacy-contract.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts scripts/zz-temp-public-secrets-health-patch.mjs .github/workflows/zz-temp-public-secrets-health-patch.yml
          git commit -m "Minimize public secrets health metadata"
          git push origin HEAD:audit/public-secrets-health-minimization-328
