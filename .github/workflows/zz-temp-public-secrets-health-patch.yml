name: Temporary public secrets health patch
on:
  push:
    branches:
      - audit/public-secrets-health-minimization-328
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/public-secrets-health-minimization-328
          fetch-depth: 0
      - name: Apply exact retained-source patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/index.ts')
          s=p.read_text()
          old="""      if(url.pathname==='/__cf/secrets-health') {
        const names = ['APP_SECRET','LINE_ACCESS_TOKEN','LINE_CHANNEL_ID','LINE_CHANNEL_SECRET','LINE_LOGIN_CHANNEL_ID','LINE_LOGIN_CHANNEL_SECRET','LINE_LIFF_ID','NOTIFY_SECRET','VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT'] as const;
        const secrets = Object.fromEntries(names.map((name) => [name, { present: typeof env[name] === 'string' && env[name].length > 0, length: typeof env[name] === 'string' ? env[name].length : 0 }]));
        return json({ok:true,worker:env.ENVIRONMENT||'unknown',secrets});
      }
"""
          new="""      if(url.pathname==='/__cf/secrets-health') return json({ok:true,service:'familytodo-secrets'});
"""
          if s.count(old)!=1:
              raise SystemExit(f'exact public secrets health source mismatch: {s.count(old)} matches')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/zz-temp-public-secrets-health-patch.yml').unlink()
      - name: Run focused privacy contract
        run: node scripts/public-secrets-health-privacy-contract.mjs
      - name: Commit exact patch and remove patcher
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts .github/workflows/zz-temp-public-secrets-health-patch.yml
          git commit -m "Minimize public secrets health metadata"
          git push origin HEAD:audit/public-secrets-health-minimization-328
