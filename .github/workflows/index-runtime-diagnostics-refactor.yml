name: Index runtime diagnostics refactor

on:
  push:
    branches:
      - refactor/index-runtime-diagnostics

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/index-runtime-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/tmp_index_runtime_diagnostics_patch.py
      - run: npm ci
      - run: node scripts/index-entrypoint-modularity-contract.mjs
      - run: npm test
      - run: git diff --check
      - name: Remove temporary patch runner
        run: git rm .github/workflows/index-runtime-diagnostics-refactor.yml scripts/tmp_index_runtime_diagnostics_patch.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor runtime diagnostics out of index"
          git push origin HEAD:refactor/index-runtime-diagnostics
