name: Audit private reminder patch

on:
  push:
    branches:
      - audit/private-task-owner-reminders

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/private-task-owner-reminders
      - name: Apply exact source and regression edits
        shell: python
        run: |
          from pathlib import Path

          index = Path('src/index.ts')
          source = index.read_text()
          old = "const ids=isPrivate?[]:[...new Set((Array.isArray(b.assignees)?(b.assignees as unknown[]).map(Number):[]).filter(n=>Number.isInteger(n)&&n>0))];"
          new = "const ids=isPrivate?[m.id]:[...new Set((Array.isArray(b.assignees)?(b.assignees as unknown[]).map(Number):[]).filter(n=>Number.isInteger(n)&&n>0))];"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one PRIVATE create recipient expression, found {source.count(old)}')
          index.write_text(source.replace(old, new, 1))

          contract = Path('scripts/private-task-foundation-contract.sh')
          text = contract.read_text()
          needle = "for(const [file,text] of checks)if(!fs.readFileSync(file,'utf8').includes(text))throw new Error(`${file}: missing ${text}`);\n"
          addition = "const index=fs.readFileSync('src/index.ts','utf8');\nif(index.includes('const ids=isPrivate?[]:'))throw new Error('src/index.ts: PRIVATE create must not drop its owner recipient');\nif(!index.includes('const ids=isPrivate?[m.id]:'))throw new Error('src/index.ts: PRIVATE create must assign its owner as the sole recipient scope');\nif(!index.includes('if(reminderAt && ids.length){'))throw new Error('src/index.ts: scheduled task reminders must use the resolved recipient scope');\n"
          if text.count(needle) != 1:
              raise SystemExit('private task contract insertion point changed')
          contract.write_text(text.replace(needle, needle + addition, 1))
      - name: Commit branch-only patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts scripts/private-task-foundation-contract.sh
          git diff --cached --check
          git commit -m "fix: scope private task reminders to owner"
          git push origin HEAD:audit/private-task-owner-reminders
