name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
        if: always()
      - run: npm run check:browser-js
        if: always()
      - run: npm run check:static-assets
        if: always()
      - run: npm run check:migrations
        if: always()
      - run: npm run check:domain-smoke
        if: always()
      - run: npm run check:wave117
        if: always()
      - run: npm run check:wave118
        if: always()
      - run: npm run check:wave119
        if: always()
      - run: npm run check:wave120
        if: always()
      - run: npm run check:wave121
        if: always()
      - run: npm run check:wave122
        if: always()
      - run: npm run check:wave123
        if: always()
      - run: npm run check:wave123-form-audit
        if: always()
      - run: npm run check:wave124
        if: always()
      - run: npm run check:wave125
        if: always()
      - run: npm run check:wave126
        if: always()
      - run: npm run check:wave127
        if: always()
      - run: npm run check:wave128
        if: always()
      - run: node scripts/wave128-fix1-smoke.mjs
        if: always()
      - run: node scripts/wave128-fix3-smoke.mjs
        if: always()
      - run: npm run check:version
        if: always()
      - run: git diff --check HEAD^
        if: always()
