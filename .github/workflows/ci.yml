name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: always()
      - run: node scripts/scheduled-cron-consolidation-contract.mjs
        if: always()
      - run: node scripts/calendar-stamp-deletion-transport-contract.mjs
        if: always()
      - run: node scripts/overdue-task-pagination-contract.mjs
        if: always()
      - run: node scripts/overdue-shopping-pagination-contract.mjs
        if: always()
      - run: node scripts/task-create-tombstone-contract.mjs
        if: always()
      - run: npm run check:browser-js
        if: always()
      - run: npm run check:pwa-family-branding
        if: always()
      - run: npm run check:location-quality-diagnostics
        if: always()
      - run: npm run check:location-long-term-history
        if: always()
      - run: npm run check:family-daily-journal
        if: always()
      - run: npm run check:family-daily-journal-ai
        if: always()
      - run: npm run check:ai-model-usage-visibility
        if: always()
      - run: npm run check:static-assets
        if: always()
      - run: npm run check:migrations
        if: always()
      - run: npm run check:calendar-stickers
        if: always()
      - run: node scripts/regression-suite.mjs
        if: always()
      - run: git diff --check HEAD^
        if: always()
