name: LINE daily digest job patch

on:
  push:
    branches:
      - refactor/line-daily-digest-job

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/line-daily-digest-job
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact extraction patch
        run: python3 scripts/tmp_line_daily_digest_job_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify focused contract
        run: node scripts/line-daily-digest-modularity-contract.mjs
      - name: Full regression suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit verified refactor
        run: |
          rm .github/workflows/line-daily-digest-job-patch.yml scripts/tmp_line_daily_digest_job_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor LINE daily digest out of index"
          git push origin HEAD:refactor/line-daily-digest-job
