name: Patch calendar recurrence range

on:
  push:
    branches:
      - fix/calendar-recurrence-batched-range

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/patch-calendar-recurrence-range.py
      - run: npm ci
      - run: npm test
      - name: Commit bounded recurrence projection
        run: |
          rm scripts/patch-calendar-recurrence-range.py
          rm .github/workflows/patch-calendar-recurrence-range.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.ts scripts/calendar-recurrence-range-performance-contract.mjs scripts/feature-contract-bundle.mjs scripts/patch-calendar-recurrence-range.py .github/workflows/patch-calendar-recurrence-range.yml
          git commit -m "fix: batch calendar recurrence projection"
          git push origin HEAD:fix/calendar-recurrence-batched-range
