name: Public route dispatcher patch
on:
  push:
    branches: [refactor/public-route-dispatcher]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact public route extraction
        run: node scripts/tmp_public_route_dispatcher_patch.mjs
      - name: Focused public route contract
        run: node scripts/public-route-dispatcher-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Browser JS
        run: npm run check:browser-js
      - name: Static assets
        run: npm run check:static-assets
      - name: Migrations
        run: npm run check:migrations
      - name: Full regression suite
        run: node scripts/regression-suite.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified public route extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/tmp_public_route_dispatcher_patch.mjs .github/workflows/public-route-dispatcher-patch.yml
          git add src/index.ts src/public-routes.ts scripts/public-route-dispatcher-contract.mjs scripts/regression-manifest.mjs scripts/public-secrets-health-privacy-contract.mjs scripts/index-entrypoint-modularity-contract.mjs scripts/context-api-route-dispatcher-contract.mjs scripts/google-integration-contract.mjs scripts/calendar-sync-foundation-contract.mjs scripts/google-home-foundation-contract.mjs scripts/platform-auth-contract.mjs
          git diff --cached --check
          git commit -m "Refactor public routes into dispatcher"
          git push
