name: Task shopping category preflight fix
on:
  push:
    branches:
      - audit/task-shopping-per-item-category-329
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/task-shopping-per-item-category-329
      - name: Apply preflight validation
        run: python3 .github/patch-330-preflight.py
      - name: Run focused checks
        run: |
          npm ci
          npm run typecheck
          node --check public/assets/task-edit.js
          node scripts/task-event-shopping-integration-contract.mjs
      - name: Commit fix and remove temporary runner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.ts scripts/task-event-shopping-integration-contract.mjs
          git rm .github/patch-330-preflight.py .github/workflows/task-shopping-category-preflight-330.yml
          git commit -m "Validate Task shopping categories before mutations"
          git push origin HEAD:audit/task-shopping-per-item-category-329
