name: Calendar range exact patch

on:
  push:
    branches:
      - fix/calendar-reversed-range-1102

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact retained-source patch
        run: node scripts/apply-calendar-range-fix.mjs
      - name: Verify complete suite before committing
        run: npm test
      - name: Commit patched sources and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/calendar-range-fix.yml scripts/apply-calendar-range-fix.mjs
          git add src/app.ts src/index.ts
          git diff --cached --check
          git commit -m "Fix Calendar reversed range rendering"
          git push origin HEAD:fix/calendar-reversed-range-1102
