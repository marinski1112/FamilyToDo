name: Calendar range exact patch

on:
  push:
    branches:
      - fix/calendar-reversed-range-1102

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact retained-source patch
        run: |
          node scripts/apply-calendar-range-fix.mjs
          node scripts/apply-calendar-range-fix-v2.mjs
      - name: Verify focused Calendar range contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/calendar-range-safety-contract.mjs > /tmp/calendar-range-focused.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo 'Calendar range focused contract failed (static CI output):'
              echo '```text'
              cat /tmp/calendar-range-focused.log
              echo '```'
            } | gh issue comment 318 --body-file -
            exit "$status"
          fi
      - name: Verify complete suite before committing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test > /tmp/calendar-range-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo 'Calendar range exact-patch validation failed (sanitized static CI tail):'
              echo '```text'
              tail -n 120 /tmp/calendar-range-test.log
              echo '```'
            } | gh issue comment 318 --body-file -
            exit "$status"
          fi
      - name: Commit patched sources and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/calendar-range-fix.yml scripts/apply-calendar-range-fix.mjs scripts/apply-calendar-range-fix-v2.mjs
          git add src/app.ts src/index.ts
          git diff --cached --check
          git commit -m "Fix Calendar reversed range rendering"
          git push origin HEAD:fix/calendar-reversed-range-1102
