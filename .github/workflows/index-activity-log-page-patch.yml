name: Index activity log page patch

on:
  push:
    branches:
      - refactor/index-activity-log-page

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/index-activity-log-page
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/tmp_index_activity_log_page_patch.mjs
      - run: node scripts/index-entrypoint-modularity-contract.mjs
      - run: npm test
      - run: git diff --check
      - name: Remove temporary patch runner
        run: rm .github/workflows/index-activity-log-page-patch.yml scripts/tmp_index_activity_log_page_patch.mjs
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor activity log page out of index"
          git push origin HEAD:refactor/index-activity-log-page
