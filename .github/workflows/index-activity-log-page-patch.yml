name: Index activity log page patch

on:
  push:
    branches:
      - refactor/index-activity-log-page

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/index-activity-log-page
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact extraction patch
        run: python3 scripts/tmp_index_activity_log_page_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify focused contract
        run: node scripts/index-activity-log-page-contract.mjs
      - name: Full regression suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit verified refactor
        run: |
          rm .github/workflows/index-activity-log-page-patch.yml scripts/tmp_index_activity_log_page_patch.py
          git config user.name "marinski1112"
          git config user.email "marinski1112@gmail.com"
          git add src/index.ts src/activity-log-page.ts scripts/index-activity-log-page-contract.mjs scripts/regression-manifest.mjs .github/workflows/index-activity-log-page-patch.yml scripts/tmp_index_activity_log_page_patch.py
          git diff --cached --check
          git commit -m "Refactor activity log page out of index"
          git push origin HEAD:refactor/index-activity-log-page
