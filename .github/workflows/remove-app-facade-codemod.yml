name: Remove app facade imports

on:
  push:
    branches:
      - control/remove-app-facade

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/remove-app-facade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite retained imports and contracts
        run: node scripts/_remove-app-facade-codemod.mjs
      - name: Typecheck before commit
        run: |
          npm ci
          npm run typecheck
      - name: Commit bounded codemod
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No codemod changes to commit'
            exit 0
          fi
          git commit -m 'Remove residual app compatibility imports'
          git push origin HEAD:control/remove-app-facade
