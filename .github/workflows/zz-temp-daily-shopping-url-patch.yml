name: Daily Shopping URL exact-source patch
on:
  push:
    branches: [fix/daily-shopping-product-url-safety]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply exact daily Shopping URL patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch retained app source exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.ts')
          s=p.read_text()
          marker="  const shoppingRows=(items:Row[])=>items.map(i=>`<div class=\"linked-shopping-row\""
          if s.count(marker) != 1:
              raise SystemExit(f'expected one daily shoppingRows renderer, found {s.count(marker)}')
          start=s.index(marker)
          end=s.index(".join('');",start)+len(".join('');")
          old=s[start:end]
          if 'i.url?' not in old or 'href=\"${esc(i.url)}\"' not in old:
              raise SystemExit('daily shoppingRows renderer no longer matches expected raw URL shape')
          new='''  const safeDailyProductUrl=(value:unknown)=>{const raw=String(value||'').trim();if(!raw||raw.length>2048)return '';try{const parsed=new URL(raw);if(parsed.username||parsed.password)return '';return parsed.protocol==='http:'||parsed.protocol==='https:'?parsed.href:'';}catch{return '';}};
  const shoppingRows=(items:Row[])=>items.map(i=>{const productUrl=safeDailyProductUrl(i.url);return `<div class="linked-shopping-row"><label class="shopping-check-row"><input class="check toggle" type="checkbox" data-type="shopping" data-id="${esc(i.id)}" ${i.status==='completed'?'checked':''}><span class="${i.status==='completed'?'done':''}">${productUrl?`<a href="${esc(productUrl)}" target="_blank" rel="noopener noreferrer">${esc(i.name)}</a>`:`<a href="/app/shopping_edit.php?id=${i.id}">${esc(i.name)}</a>`}${i.quantity&&i.quantity!=='1'?` × ${esc(i.quantity)}`:''}</span></label><div class="meta">${[i.category||'',i.assignees?'担当 '+i.assignees:'',i.due_date?'期限 '+i.due_date:''].filter(Boolean).map(esc).join(' ・ ')}${productUrl?` ・ <a href="${esc(productUrl)}" target="_blank" rel="noopener noreferrer">商品ページ</a>`:''}</div></div>`;}).join('');'''
          p.write_text(s[:start]+new+s[end:])
          PY
      - run: npm ci
      - run: node scripts/shopping-product-url-safety-contract.mjs
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit exact source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Apply exact daily Shopping URL patch'
          git push origin HEAD:${GITHUB_REF_NAME}
