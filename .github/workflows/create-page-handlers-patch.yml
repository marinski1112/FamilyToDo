name: Create page handlers patch
on:
  push:
    branches: [refactor/create-page-handlers]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact create page extraction
        run: node scripts/tmp_create_page_handlers_patch.mjs
      - name: Focused create pages contract
        run: node scripts/create-pages-modularity-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Browser JS
        run: npm run check:browser-js
      - name: Static assets
        run: npm run check:static-assets
      - name: Migrations
        run: npm run check:migrations
      - name: Full regression suite
        run: node scripts/regression-suite.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified create page extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/tmp_create_page_handlers_patch.mjs .github/workflows/create-page-handlers-patch.yml
          git add src/index.ts src/create-pages.ts scripts/create-pages-modularity-contract.mjs scripts/regression-manifest.mjs
          git diff --cached --check
          git commit -m "Refactor create page handlers out of index"
          git push
