name: Child Journal Google Home milestone patch

on:
  push:
    branches:
      - feature/child-journal-google-home-milestones

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/child-journal-google-home-milestones
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact Google Home Child Journal wiring and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/google-home.ts)" = "7a6f668d4bf4487070f7bc1688714af6eeb4e7a0"
          test "$(git hash-object src/child-journal-google-home.ts)" = "9c95523b4e1d3ce0a3957f6bcf0b5378668c3157"
          test "$(git hash-object scripts/child-journal-google-home-contract.mjs)" = "4c29c7d6043b9be84a3780b51995a647713c8911"
          test "$(git hash-object scripts/feature-contract-bundle.mjs)" = "a971b660182cdc7cf651e01baad886f498340221"
          test "$(git hash-object docs/GOOGLE_HOME_VOICE_SETUP.md)" = "f5a83af72f6d5e836aeee64e4c8a0e60f2016f81"
          python scripts/tmp_child_journal_google_home_patch.py
          node scripts/child-journal-google-home-contract.mjs
          npm test
          git diff --check
          rm .github/workflows/child-journal-google-home-patch.yml scripts/tmp_child_journal_google_home_patch.py
      - name: Commit Google Home Child Journal milestones
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/google-home.ts src/child-journal-google-home.ts scripts/child-journal-google-home-contract.mjs scripts/feature-contract-bundle.mjs docs/GOOGLE_HOME_VOICE_SETUP.md .github/workflows/child-journal-google-home-patch.yml scripts/tmp_child_journal_google_home_patch.py
          git diff --cached --check
          git commit -m "Add Google Home Child Journal milestones"
          git push origin HEAD:feature/child-journal-google-home-milestones
