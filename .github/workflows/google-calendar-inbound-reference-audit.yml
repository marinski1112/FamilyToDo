name: Google Calendar Inbound Reference Audit

on:
  push:
    branches:
      - control/remove-google-calendar-inbound

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert retired normal Calendar inbound source is absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'processCalendarInbound|calendarSyncNow|calendarWatchWebhook|syncCalendarAccount|syncCalendarAccountPage|syncCalendarAccountUnlocked|applyInboundSafely|reconcileHintedInbound|hintedInboundAlreadyProjected|sameInboundShape|inboundEventTimes|applyInbound|PAGE_PREFIX|INBOUND_PAGE_SIZE|syncLeases|nextSyncToken' src/google-calendar.ts src/google-calendar-core.ts; then
            echo 'Retired normal Calendar inbound implementation remains in source.' >&2
            exit 1
          fi
          grep -n 'calendarSyncOutboundOnly(request,context)' src/context-api-routes.ts
          grep -n 'calendarWatchNotificationOnly(request,env)' src/public-routes.ts
          grep -n 'received: 0' src/google-calendar-one-way.ts
          grep -n 'inbound_more: false' src/google-calendar-one-way.ts
      - run: npm run typecheck
        if: always()
      - run: npm run check:browser-js
        if: always()
      - run: npm run check:static-assets
        if: always()
      - run: npm run check:migrations
        if: always()
      - run: node scripts/regression-suite.mjs
        if: always()
      - name: Diff check against current main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Workers dry-run
        if: always()
        run: npx wrangler deploy --dry-run
